{% extends "base.html" %}
{% block content %}
<section>
  <h2>Definir orçamento</h2>
  <form method="post" action="{{ url_for('salvar_orcamento') }}" class="grid">
    <label>Mês<input name="mes" type="number" min="1" max="12" value="{{ mes }}" required /></label>
    <label>Ano<input name="ano" type="number" min="1900" value="{{ ano }}" required /></label>
    <label>Valor<input name="valor" type="number" min="0" step="0.01" value="{{ valor if valor is not none else 0 }}" required /></label>
    <button type="submit">Salvar orçamento</button>
  </form>

  <p>
    Orçamento atual para {{ '%02d'|format(mes) }}/{{ ano }}:
    {% if valor is not none %}
      <strong>R$ {{ '%.2f'|format(valor) }}</strong>
    {% else %}
      <strong>Não definido</strong>
    {% endif %}
  </p>
</section>
{% endblock %}
